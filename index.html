:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --ink:#16202B; --muted:#5B6877; --line:#D8DDE3; --soft:#E8ECF0;
  --pA:#2F63B5; --pB:#E9B820; --pC:#2E9162; --pM:#7C8A9A; --pX:#CF3B33;
  --onA:#FFFFFF; --onB:#16202B; --onC:#FFFFFF; --onM:#FFFFFF; --onX:#FFFFFF;
  --btn:#16202B; --onbtn:#FFFFFF; --ok:#2E9162; --warn:#B4551A;
  --head:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ color-scheme:dark; --bg:#10151B; --surface:#1A222B; --ink:#E9EEF3; --muted:#9BA8B6; --line:#2C3743; --soft:#232D38;
    --pA:#5B8EDC; --pB:#EEC535; --pC:#47B27F; --pM:#8E9CAC; --pX:#E4574E; --btn:#E9EEF3; --onbtn:#10151B; --warn:#E39A62; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--head);font-weight:700;margin:0;line-height:1.05;letter-spacing:.005em}
h1{font-size:2.3rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0 0 .6rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pA);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h3{margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--btn);color:var(--onbtn);font-weight:600;font-size:1rem}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:.92rem;border-radius:10px}
.btn.danger{background:transparent;color:var(--pX);border:1.5px solid var(--pX)}
.link{background:none;border:0;padding:6px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--soft);color:var(--ink)}
.tag.new{background:var(--pB);color:#16202B}
.banner{background:#FFF1D6;color:#5B3A00;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.9rem}
.banner.dl{background:var(--soft);color:var(--ink)}
.banner.good{background:#DDF1E6;color:#10432B}
@media (prefers-color-scheme:dark){.banner{background:#4A3A18;color:#F6E3B8}.banner.good{background:#173A29;color:#BFE8D0}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;min-width:0;border:0;background:none;padding:9px 1px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.64rem;white-space:nowrap;font-weight:600;color:var(--muted)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--ink)}
nav button[aria-current=page] svg{stroke-width:2.4}
.plates{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 4px}
.plate{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:1.05rem;border:3px solid var(--c);color:var(--c);background:transparent;position:relative}
.plate.done{background:var(--c);color:var(--on)}
.plate.today::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ink)}
.plate.rest{--c:var(--line);color:var(--muted)}
.plate small{position:absolute;bottom:-17px;font-family:var(--body);font-size:.66rem;font-weight:600;color:var(--muted)}
.platewrap{padding-bottom:18px}
.cA{--c:var(--pA);--on:var(--onA)} .cB{--c:var(--pB);--on:var(--onB)} .cC{--c:var(--pC);--on:var(--onC)} .cM{--c:var(--pM);--on:var(--onM)} .cX{--c:var(--pX);--on:var(--onX)}
.stripe{border-left:8px solid var(--c)}
.sessbadge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--on);font-family:var(--head);font-size:1.7rem;font-weight:700;flex:none}
.exlist{list-style:none;margin:8px 0 12px;padding:0}
.exlist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.exlist li:last-child{border:0}
.exlist b{font-family:var(--head);font-size:1.1rem;white-space:nowrap}
.top{position:sticky;top:0;background:var(--bg);z-index:10;padding:10px 16px;border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h2{flex:1;font-size:1.35rem}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.ex h3{font-size:1.3rem;margin-bottom:2px}
.ex .target{font-family:var(--head);font-weight:700;font-size:1.05rem;color:var(--c)}
.ex.cB .target{color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted);margin:2px 0 6px}
.hint.up{color:var(--ok);font-weight:600}
details.how{margin:4px 0 8px;font-size:.9rem;color:var(--muted)}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink);padding:4px 0}
.set{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center;margin:6px 0}
.set .n{font-family:var(--head);font-weight:700;font-size:1.2rem;color:var(--muted);text-align:center}
.set input{width:100%;height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;font-size:1.15rem;text-align:center;padding:0 4px}
.set input::placeholder{color:var(--muted);font-weight:400;font-size:.9rem}
.set .ck{height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.set .ck svg{width:26px;height:26px;stroke:var(--surface);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.set.done .ck{background:var(--ok);border-color:var(--ok)} .set.done .ck svg{stroke:#fff}
.set.done input{border-color:var(--ok)}
.cols{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;font-size:.74rem;font-weight:600;color:var(--muted);text-align:center;margin-top:6px}
.addset{margin-top:2px}
#rest{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:30;display:none}
#rest.on{display:block}
body.fs{padding-bottom:110px} body.fs #rest{bottom:calc(10px + env(safe-area-inset-bottom))}
#rest .in{max-width:560px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#rest .t{font-family:var(--head);font-size:2rem;font-weight:700;flex:1;font-variant-numeric:tabular-nums}
#rest button{background:rgba(255,255,255,.14);color:inherit;border:0;border-radius:10px;min-height:42px;padding:0 12px;font-weight:600}
@media (prefers-color-scheme:dark){#rest button{background:rgba(0,0,0,.16)}}
.phase{margin:0 0 16px}
.phase h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.wk{border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-height:58px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.wk b{font-family:var(--head);font-size:1.45rem;line-height:1}
.wk span{font-size:.7rem;color:var(--muted);font-weight:600}
.wk.dl{border-style:dashed}
.wk.cur{border:3px solid var(--ink)}
.wk.full{background:var(--ok);border-color:var(--ok);color:#fff}.wk.full span{color:#fff}
.wk.part{background:var(--soft)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 10px;flex:1}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select{height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.05rem;padding:0 10px;width:100%}

.player{text-align:center;padding:10px 0}

.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}

.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 12px}
.stat{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--head);font-size:2.35rem;line-height:1;font-variant-numeric:tabular-nums}

.up{color:var(--ok)}

.pr:last-child{border:0}
.pr b{font-family:var(--head);font-size:1.15rem;white-space:nowrap}

.eqi{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.eqi:last-child{border:0}
.eqi input{position:absolute;opacity:0;width:1px;height:1px}

.eqi .box svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}

.eqt b{display:block;font-size:1rem;line-height:1.2}

.fb{margin:2px 0 8px 36px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:.86rem;display:flex;gap:8px;align-items:center;justify-content:space-between}

.fb button{flex:none;border:0;border-radius:8px;min-height:34px;padding:0 10px;background:var(--btn);color:var(--onbtn);font-weight:600}

.libitem:last-child{border:0}
.libitem small{color:var(--muted);font-size:.78rem}

.tchip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:.84rem;font-weight:600;min-height:34px}
.tchip.on{background:var(--btn);color:var(--onbtn);border-color:var(--btn)}
.tc{display:inline-block;position:relative} .tc input{position:absolute;opacity:0;width:1px;height:1px}
.tc span{display:inline-block;padding:6px 11px;border-radius:99px;border:1.5px solid var(--line);font-size:.86rem;font-weight:600;background:var(--surface);cursor:pointer}

.tg{margin:10px 0 2px;font-size:.78rem;font-weight:600;color:var(--muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.search{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.05rem;padding:0 14px;margin:8px 0}
.libitem b{font-weight:600}
.libitem .st{font-size:.76rem;color:var(--muted);text-align:right;max-width:38%}
textarea.fld{width:100%;min-height:90px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1rem;padding:10px;resize:vertical}
.sumhead{text-align:center;padding:18px 0 8px}

<script>

const fmtDate = s => { const d = parseYmd(s); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'; };

const num = v => { if(v===null||v===undefined||v==='') return null; const n = parseFloat(String(v).replace(',','.')); return isNaN(n) ? null : n; };

const Store = {
  mode:'memory',
  async load(){
    try{ if(window.storage){ this.mode='claude'; const r = await window.storage.get(KEY,false); return r ? JSON.parse(r.value) : null; } }
    catch(e){ if(window.storage){ this.mode='claude'; return null; } }

    catch(e){ this.mode='memory'; return null; }

  async save(s){
    const j = JSON.stringify(s);

/* ============ Zustand ============ */
const DEF = () => ({ v:2, start:ymd(new Date()), bar:2.5, sessions:[], mobs:[], body:[], wp:{}, draft:null, summary:null, lastBackup:null,
  eq:Object.fromEntries(PLAN.equip.map(e => [e.id, !!e.own])),
  custom:[], fav:{}, hide:{}, pref:{}, extras:{A:[],B:[],C:[]}, plates:{'1.25':6,'2.5':4,'5':8,'10':4},

  if(!o.plates){ S.plates = d.plates; S.eq.plates = true; } }
const UI = { view:'today', arg:null, exSel:null, pick:false, toast:'', q:'', tags:[], flt:{}, fOpen:false, form:null, pq:'', pt:'', pc:'', pm:'db2' };

/* ============ Plan-Logik ============ */

const phaseOf = n => PLAN.phases.find(p => p.i === wkInfo(n).phase);

const currentWeek = () => monRel(ymd(new Date()));
const sessionsInWeek = n => S.sessions.filter(x => monRel(x.date) === n);
function nextSession(){ const last = S.sessions.length ? S.sessions[S.sessions.length-1].type : null; return last ? {A:'B',B:'C',C:'A'}[last] : 'A'; }

/* ---------- Übungszugriff (eingebaut und eigene) ---------- */
const customOf = id => S.custom.find(c => c.id===id);
function autoTagsJS(e){
  const t = e.req.map(r => PLAN.eqtag[r]).filter(Boolean); if(!t.length) t.push('Körpergewicht');
  t.push(PLAN.kindtag[e.kind]); if(e.perside) t.push('Einseitig'); if(e.unit==='s') t.push('Zeitübung'); return t;
}

  const c = customOf(id);
  if(c) return {n:c.n, kind:c.kind, rest:c.rest, how:c.how||'', req:c.req||[], unit:c.unit||'', perside:!!c.perside, tags:[...new Set([...(c.tags||[]), ...autoTagsJS(c)])], custom:true};
  return {n:'(gelöschte Übung)', kind:'acc', rest:60, how:'', req:[], unit:'', perside:false, tags:[]};
}
function tipOf(id){
  if(PLAN.tips[id]) return PLAN.tips[id];
  const c = customOf(id); return {steps:[], fehler:[], start:'', notes:(c&&c.how)||''};
}
function prescOf(id, w){
  const i = Math.min(Math.max(w,1),24)-1;
  if(PLAN.presc[id]) return PLAN.presc[id][i];
  const c = customOf(id) || {kind:'acc'}, wi = wkInfo(w), pi = wi.phase-1;
  const sets = wi.deload ? 2 : wi.phase===1 ? (w<=2?2:3) : ((wi.phase===3||wi.phase===4)&&c.kind==='main') ? 4 : 3;
  const reps = c.reps ? c.reps : (c.kind==='core'||c.unit==='s') ? PLAN.coreSec[pi] : PLAN.phaseReps[pi][c.kind];
  return [sets, reps];
}
const allIds = () => [...Object.keys(PLAN.ex), ...S.custom.filter(c => !c.archived).map(c => c.id)];
const exAvail = id => { const c = customOf(id); if(c && c.archived) return false; return exOf(id).req.every(has) && !S.hide[id]; };
const slotById = sid => { for(const t of ['A','B','C']){ const sl = PLAN.sessions[t].slots.find(x => x.id===sid); if(sl) return sl; } return null; };
const slotPool = slot => [...new Set([...slot.c, ...(slot.alt||[]), ...S.custom.filter(x => !x.archived && x.slot===slot.id).map(x => x.id)])];
function pickForSlot(slot, w){
  const prim = slot.c.filter(exAvail), pool = slotPool(slot).filter(exAvail);
  if(slot.opt && !prim.length) return null;
  if(!pool.length) return null;
  const pref = S.pref[slot.id]; if(pref && pool.includes(pref)) return pref;
  const fav = pool.find(id => S.fav[id]); if(fav) return fav;
  if(S.cfg.variety==='rotate' && pool.length>1) return pool[(wkInfo(w).phase-1) % pool.length];
  return prim[0] || pool[0];
}
function sessionItems(type, w){

  const push = (id, slot, extra) => { used.add(id); const [sets,reps] = prescOf(id,w); out.push({id, slot, sets, reps, extra}); };
  for(const slot of PLAN.sessions[type].slots){
    let id = pickForSlot(slot, w); if(!id) continue;
    if(used.has(id)){ id = slotPool(slot).filter(exAvail).find(x => !used.has(x)); if(!id) continue; }
    push(id, slot.id, false);
  }
  for(const id of (S.extras[type]||[])){ if(used.has(id) || !exAvail(id)) continue; push(id, null, true); }
  return out;
}
const freshSets = (id, n) => { const ll = lastLog(id), base = ll ? ll.sets[ll.sets.length-1] : null; return Array.from({length:n}, () => ({w: base ? base.w : '', r:'', d:false})); };
function chosenIds(){
  const w = Math.max(currentWeek(),1), s = new Set();

}
const mobSteps = id => PLAN.mobility[id].steps.filter(s => (s.req||[]).every(has));
function lastLog(exId){
  for(let i = S.sessions.length-1; i >= 0; i--){
    const sets = S.sessions[i].sets && S.sessions[i].sets[exId];
    if(sets && sets.some(x => x.d)) return {date:S.sessions[i].date, sets:sets.filter(x => x.d)};

const repHigh = r => { const m = String(r).match(/(\d+)\s*[–-]\s*(\d+)/); return m ? +m[2] : null; };

/* ============ Kennzahlen ============ */
const e1rm = (w,r) => w*(1+r/30);
function setMetric(s){ const w = num(s.w), r = num(s.r); if(r===null||r<=0) return null; return (w&&w>0) ? e1rm(w,r) : r; }
function bestSet(arr){ let b=null, bm=-1; for(const s of arr){ const m = setMetric(s); if(m!==null && m>bm){ bm=m; b=s; } } return b ? {s:b, m:bm} : null; }
function history(){
  const h = {};
  for(const se of S.sessions) for(const [id,arr] of Object.entries(se.sets||{})){
    const b = bestSet(arr.filter(x => x.d)); if(b) (h[id] = h[id] || []).push({date:se.date, m:b.m, s:b.s});
  }
  return h;
}
function fmtSet(id, s){
  const e = exOf(id), w = num(s.w), r = num(s.r);
  if(e.unit==='s') return r+' s';
  return (w&&w>0) ? fmtN(w)+' kg × '+r : r+' Wdh.';
}
function prEvents(){
  const ev = [], mx = {};
  for(const se of S.sessions) for(const [id,arr] of Object.entries(se.sets||{})){
    const b = bestSet(arr.filter(x => x.d)); if(!b) continue;
    if(mx[id]!=null && b.m > mx[id]*1.001) ev.push({date:se.date, id, s:b.s, pct:b.m/mx[id]-1});
    mx[id] = Math.max(mx[id]||0, b.m);
  }
  return ev;
}
function bodySeries(){
  const arr = S.body.filter(x => x.kg!=null).sort((a,b) => a.date<b.date?-1:1).map(x => ({date:x.date, kg:x.kg}));
  if(!arr.length || arr[0].date > S.start) arr.unshift({date:S.start, kg:S.cfg.startKg});
  return arr;
}
const latestKg = () => { const b = bodySeries(); return b[b.length-1].kg; };
function streaks(){
  const cw = Math.max(currentWeek(),1); let run=0, best=0;
  for(let w=1; w<=cw; w++){
    const c = sessionsInWeek(w).length;
    if(c>=2){ run++; best = Math.max(best,run); } else if(w!==cw) run = 0;
  }
  return {cur:run, best};
}
function stats(){
  let vol=0, reps=0, nsets=0;
  for(const se of S.sessions) for(const arr of Object.values(se.sets||{})) for(const s of arr){
    if(!s.d) continue; const r = num(s.r)||0, w = num(s.w)||0; reps += r; nsets++; vol += w*r;
  }
  const h = history(), gains = [];
  for(const a of Object.values(h)) if(a.length>=2 && a[0].m>0) gains.push(a[a.length-1].m/a[0].m - 1);
  const gain = gains.length ? gains.reduce((a,b)=>a+b,0)/gains.length : null;
  const kg = latestKg(), lost = S.cfg.startKg - kg;
  const waist = S.body.filter(x => x.waist!=null).sort((a,b)=>a.date<b.date?-1:1);
  const waistD = waist.length>=2 ? waist[waist.length-1].waist - waist[0].waist : null;
  const prs = prEvents();
  const exCount = Object.keys(h).length;
  const stepDays = S.body.filter(x => x.steps!=null && x.steps >= S.cfg.steps).length;
  const gearEx = Object.keys(h).filter(id => exOf(id).req.some(r => !PLAN.equip.find(e=>e.id===r).own)).length;
  return {n:S.sessions.length, vol, reps, nsets, gain, kg, lost, waistD, prs, exCount, stepDays, gearEx, streak:streaks()};
}
function badges(st){

/* ---------- Equipment ---------- */
function unlocks(id){
  const out = [];
  for(const [eid,e] of [...Object.entries(PLAN.ex), ...S.custom.filter(c=>!c.archived).map(c => [c.id, exOf(c.id)])]){
    if(e.req.includes(id)){
      const other = e.req.filter(r => r!==id && !has(r));
      out.push({n:e.n, other:other.map(eqName)});
    }
  }
  for(const m of Object.values(PLAN.mobility)) for(const s of m.steps) if((s.req||[]).includes(id)) out.push({n:s.n+' (Mobility)', other:[]});
  if(id==='walkpad') out.push({n:'Schritte-Blöcke auf der Heute-Seite', other:[]});
  return out;
}
const MUSCLES = ['Brust','Rücken','Schultern','Bizeps','Trizeps','Unterarme','Beine','Beinbeuger','Gesäß','Waden','Core'];
function eqMuscles(e){
  const cnt = {};
  for(const id of allIds()){ const x = exOf(id); if(!x.req.includes(e.id)) continue; for(const t of x.tags) if(MUSCLES.includes(t)) cnt[t] = (cnt[t]||0)+1; }
  const top = Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,6).map(x => x[0]);
  if(e.muscles) return [...new Set([...top, ...e.muscles])].join(', ');
  return top.length ? top.join(', ') : 'Mobilität und Erholung';
}
function coverage(){
  const ids = allIds().filter(id => !(customOf(id) && customOf(id).archived)), out = [];
  for(const m of MUSCLES){
    const pool = ids.filter(id => exOf(id).tags.includes(m)), n = pool.filter(exAvail).length;
    let best = null;
    for(const g of PLAN.equip){
      if(has(g.id)) continue;
      const gain = pool.filter(id => { if(S.hide[id]) return false; const miss = exOf(id).req.filter(r => !has(r)); return miss.length===1 && miss[0]===g.id; }).length;
      if(gain>0 && (!best || gain>best.gain)) best = {gain, name:g.name.split(' (')[0]};
    }
    out.push({m, n, best});
  }
  return out;
}

}

/* ---------- Workout ---------- */
function startWorkout(type, short){
  if(S.draft && S.draft.type===type){ setView('workout'); return; }
  const w = Math.max(currentWeek(),1);
  let items = sessionItems(type, w);
  if(short) items = items.slice(0,4);
  const sets = {};
  for(const it of items) sets[it.id] = freshSets(it.id, it.sets);
  S.draft = {type, date:ymd(new Date()), week:w, items, short:!!short, sets, t0:Date.now()};
  save(); setView('workout');
}

    } else hint = `<div class="hint">${isNewEx(it.id)&&S.sessions.length?'Neue Übung. Tippe auf Technik und Tipps und starte leicht, um dein Gewicht zu finden.':'Erstes Mal: Tippe auf Technik und Tipps und starte leicht, um dein Gewicht zu finden.'}</div>`;

function setRow(ex,i,s,isTime){

function updateWorkoutProgress(){
  const d = S.draft; if(!d) return; let tot=0, dn=0;
  Object.values(d.sets).forEach(a => a.forEach(s => { tot++; if(s.d) dn++; }));
  const el = $('#prog'); if(el) el.textContent = dn+'/'+tot;
}
const volOf = sets => { let v=0; Object.values(sets).forEach(a => a.forEach(s => { v += (num(s.w)||0)*(num(s.r)||0); })); return v; };
function finishWorkout(){
  const d = S.draft; if(!d) return;
  const sets = {}; let any = false;
  for(const [k,a] of Object.entries(d.sets)){
    const keep = a.filter(s => s.d || num(s.r)!==null);
    keep.forEach(s => { s.d = true; any = true; });
    if(keep.length) sets[k] = keep;
  }
  if(!any){ if(!confirm('Es sind keine Sätze eingetragen. Training trotzdem verwerfen?')) return; S.draft=null; save(); stopRest(); setView('today'); return; }
  const prev = {};
  for(const se of S.sessions) for(const [id,arr] of Object.entries(se.sets||{})){ const b = bestSet(arr.filter(x=>x.d)); if(b) prev[id] = Math.max(prev[id]||0, b.m); }
  const prs = [], news = []; let nsets = 0;
  for(const [id,arr] of Object.entries(sets)){
    nsets += arr.length; const b = bestSet(arr); if(!b) continue;
    if(prev[id]==null) news.push(id); else if(b.m > prev[id]*1.001) prs.push({id, s:b.s, pct:b.m/prev[id]-1});
  }
  const lastSame = [...S.sessions].reverse().find(x => x.type===d.type);
  const mins = Math.max(1, Math.round((Date.now()-d.t0)/60000));
  S.summary = {type:d.type, date:d.date, week:d.week, vol:volOf(sets), nsets, mins, prs, news, volPrev: lastSame ? volOf(lastSame.sets) : null};
  S.sessions.push({id:uid(), date:d.date, type:d.type, week:d.week, sets, note:d.note||'', mins});
  S.sessions.sort((a,b) => a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
  S.draft = null; flush(); stopRest(); setView('summary');
}

/* ---------- Gewichts-Rückmeldung nach jedem Satz ---------- */
function repRange(r){ const m = String(r).match(/(\d+)\s*[–-]\s*(\d+)/); if(m) return [+m[1], +m[2]]; const n = String(r).match(/(\d+)/); return n ? [+n[1], +n[1]] : null; }
function feedback(exId, i, s, hasNext){
  const e = exOf(exId); if(e.unit==='s') return '';
  const it = S.draft.items.find(x => x.id===exId), rg = it && repRange(it.reps), w = num(s.w), r = num(s.r);
  if(!rg || r===null || r<=0 || w===null || w<=0) return '';
  if(wkInfo(S.draft.week).deload) return `<div class="fb"><span>Entlastungswoche: leicht bleiben und sauber arbeiten.</span></div>`;
  const step = e.req.includes('barbell') ? Math.max(5, minStep()) : minStep(), rir = wkInfo(S.draft.week).rir, when = hasNext ? 'nächster Satz' : 'nächstes Mal';
  const btn = (nw) => hasNext ? `<button data-a="applyw" data-ex="${exId}" data-i="${i}" data-w="${nw}">${fmtN(nw)} kg übernehmen</button>` : '';
  if(r > rg[1]){ const nw = w+step; return `<div class="fb up"><span><b>Zu leicht.</b> ${r} Wdh. liegen über dem Bereich (${rg[0]}–${rg[1]}). ${when[0].toUpperCase()+when.slice(1)}: ${fmtN(nw)} kg.</span>${btn(nw)}</div>`; }
  if(r < rg[0]){ const nw = Math.max(0, w-step); return `<div class="fb dn"><span><b>Zu schwer.</b> ${r} Wdh. liegen unter dem Bereich (${rg[0]}–${rg[1]}). ${when[0].toUpperCase()+when.slice(1)}: ${fmtN(nw)} kg.</span>${btn(nw)}</div>`; }
  return `<div class="fb"><span><b>Im Bereich.</b> Das Gewicht passt, wenn noch ca. ${rir} Wiederholungen übrig waren. Waren es deutlich mehr, probiere ${fmtN(w+step)} kg.</span></div>`;

function vGuide(){
  const rows = [['4+','Fühlt sich locker an, das Tempo bleibt gleich. Typisch für Aufwärmsätze und Entlastungswochen.'],['3','Es wird zäh, aber du hättest noch 3 Wiederholungen geschafft.'],['2','Anstrengend, die letzten Wiederholungen werden langsamer.'],['1','Die letzte Wiederholung ist ein Kampf, eine weitere ginge gerade noch.'],['0','Muskelversagen, es geht nichts mehr. Meide das, vor allem ohne Sicherung.']];

  <div class="card stripe cB"><h3>Dein ideales Gewicht</h3><p>Das ideale Gewicht ist das, mit dem du alle Wiederholungen im Zielbereich schaffst und am Ende des Satzes noch etwas Reserve hast. Dafür brauchst du kein Maximalgewicht und keine Tests.</p></div>
  <div class="card"><h3>Schritt 1: Reserve verstehen</h3><p class="small muted">Reserve (RIR) heißt: Wie viele Wiederholungen hättest du noch geschafft? Das Ziel steht in jeder Woche im Plan.</p>

  <div class="card"><h3>Schritt 2: Gewicht bei einer neuen Übung finden</h3><ol class="small" style="margin:0;padding-left:20px"><li>Mach zuerst einen Aufwärmsatz mit sehr leichtem Gewicht, 8 Wiederholungen.</li><li>Nimm für Satz 1 die Startidee aus dem Tipp-Fenster der Übung und mach die Zielwiederholungen.</li><li>Trage Gewicht und Wiederholungen ein. Die App zeigt dir: zu leicht, im Bereich oder zu schwer.</li><li>Über dem Bereich: nächster Satz ${fmtN(minStep())} kg mehr. Unter dem Bereich: ${fmtN(minStep())} kg weniger. Im Bereich: bleib dabei.</li><li>Nach ein bis zwei Trainings hast du dein Arbeitsgewicht.</li></ol></div>
  <div class="card"><h3>Schritt 3: Steigern</h3><p class="small">Doppelte Progression: Erst schaffst du in allen Sätzen mehr Wiederholungen bis zum oberen Ende des Bereichs. Dann erhöhst du das Gewicht um ${fmtN(minStep())} kg und startest wieder am unteren Ende. Mit deinen Scheiben ist ${fmtN(minStep())} kg pro Hantel der kleinste Schritt (je ${fmtN(minStep()/2)} kg pro Seite). Das ist bei Curls und Seitheben viel, dann gehst du erst über mehr Wiederholungen.</p></div>
  <div class="card"><h3>Schritt 4: Woran du es merkst</h3><ul class="plain small"><li><b>Zu schwer:</b> die Technik bricht, die Wiederholungen fallen von Satz zu Satz um mehr als 3, du brauchst Schwung, oder es zieht im Gelenk.</li><li><b>Zu leicht:</b> die Zielwiederholungen fühlen sich wie Aufwärmen an, du hast mehr als 4 Wiederholungen übrig.</li><li><b>Passt:</b> sauber bis zum Schluss, die Wiederholungen fallen pro Satz um 1 bis 3.</li><li>Fallen sie stärker ab, verlängere die Pause auf 2 bis 3 Minuten oder senke das Gewicht.</li></ul></div>
  <div class="card"><h3>Schritt 5: Tagesform</h3><p class="small">Nach einer schlechten Nacht (mit einem Dreijährigen keine Seltenheit) nimm 5 bis 10 % weniger Gewicht. Das zählt als Training, nicht als Rückschritt. In Entlastungswochen bleibst du bewusst leichter.</p></div>
  <div class="card"><h3>Grundregeln für saubere Ausführung</h3><ul class="plain small"><li><b>Tempo:</b> in etwa 2 Sekunden absenken, unten kein Schwung, zügig aber kontrolliert hoch.</li><li><b>Atmung:</b> ausatmen bei der Anstrengung, einatmen beim Absenken, nie die Luft anhalten.</li><li><b>Rücken:</b> neutral, nicht rund und nicht im Hohlkreuz. Bauch fest, bevor du startest.</li><li><b>Bewegungsradius:</b> so voll, wie du ihn sauber kontrollierst. Tiefe Ausführung mit leichterem Gewicht ist besser als halbe Wiederholungen mit schwerem.</li><li><b>Sicherheit:</b> Sternverschlüsse fest, Bank stabil, Hanteln bei Versagen seitlich ablegen, bei Langhantel immer Sicherung im Rack.</li><li><b>Schmerz:</b> Muskelbrennen und Muskelkater sind normal. Stechender Schmerz im Gelenk heißt: Übung abbrechen und leichter oder anders ausführen.</li><li><b>Pausen:</b> Hauptübungen 90 bis 120 Sekunden, kleinere Übungen 45 bis 75 Sekunden. Die Pausenuhr startet nach jedem Satz.</li></ul></div>

}
function swapItem(oldId, newId, remember){

  const old = d.items[idx], [sets, reps] = prescOf(newId, d.week);

}

let restEnd = 0, restTimer = null, actx = null;

    o.connect(g); g.connect(actx.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(actx.currentTime + .25); }catch(e){}

}

function lineChart(points, opts={}){
  if(points.length < 2) return `<p class="muted small">Sobald du mindestens zwei Einträge hast, siehst du hier den Verlauf.</p>`;
  const W=520,H=210,L=40,R=10,T=12,B=26;
  const xs = points.map(p=>+p.x), x0=Math.min(...xs), x1=Math.max(...xs);
  const ys = points.flatMap(p=>[p.y,p.y2].filter(v=>v!=null));
  let y0=Math.min(...ys), y1=Math.max(...ys); const padY=(y1-y0)*.15||1; y0-=padY; y1+=padY;
  if(opts.zero) y0 = Math.max(0, y0);
  const X = v => L + (x1===x0?0:(v-x0)/(x1-x0))*(W-L-R), Y = v => T + (1-(v-y0)/(y1-y0))*(H-T-B);
  const path = k => points.filter(p=>p[k]!=null).map((p,i)=>(i?'L':'M')+X(+p.x).toFixed(1)+' '+Y(p[k]).toFixed(1)).join(' ');
  let g = '';
  for(let i=0;i<=3;i++){ const v = y0+(y1-y0)*i/3, y=Y(v); g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${opts.int?fmtInt(v):fmtN(Math.round(v*10)/10)}</text>`; }
  const dfmt = d => pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.';
  g += `<text x="${L}" y="${H-6}">${dfmt(points[0].x)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dfmt(points[points.length-1].x)}</text>`;
  const col = opts.color||'var(--pA)', hasAvg = points.some(p=>p.y2!=null);
  const dots = points.map(p=>`<circle cx="${X(+p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="${col}" opacity="${hasAvg?.45:1}"/>`).join('');
  const line = hasAvg ? `<path d="${path('y2')}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>` : `<path d="${path('y')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label||'Verlauf'}">${g}${line}${dots}</svg>`;
}

/* ---------- Mehr ---------- */
const PLATE_W = [0.5, 1, 1.25, 2, 2.5, 5, 10, 15, 20, 25];
const plateEntries = () => Object.entries(S.plates).map(([w,c]) => [parseFloat(w), c]).filter(x => x[1]>0).sort((a,b) => b[0]-a[0]);
const plateTotal = () => plateEntries().reduce((t,[w,c]) => t + w*c, 0);
const plateCap = sides => plateEntries().reduce((t,[w,c]) => t + Math.floor(c/sides)*w, 0);
const maxDb = () => S.bar + 2*plateCap(4);
function minStep(){
  const e = plateEntries(); if(!e.length) return 2.5;
  const ok = e.filter(x => x[1]>=4), pool = ok.length ? ok : e;
  return Math.round(2*Math.min(...pool.map(x => x[0]))*100)/100;
}
function plateSolve(per, sides){
  const items = plateEntries().map(([w,c]) => [Math.round(w*4), Math.floor(c/sides)]).filter(x => x[1]>0), T = Math.round(per*4), memo = new Map();
  const go = (i, rem) => {
    if(rem===0) return []; if(i>=items.length) return null; const k = i+':'+rem; if(memo.has(k)) return memo.get(k);
    const [w,a] = items[i]; let res = null;
    for(let u = Math.min(a, Math.floor(rem/w)); u>=0 && !res; u--){ const r = go(i+1, rem-u*w); if(r) res = [u, ...r]; }
    memo.set(k, res); return res;
  };
  const r = go(0, T); if(!r) return null;
  return items.map((it,i) => [it[0]/4, r[i]]).filter(x => x[1]>0);
}
function plateReach(sides){
  let reach = new Set([0]);
  for(const [w,c] of plateEntries()){ const u = Math.round(w*4), a = Math.floor(c/sides); for(let k=0;k<a;k++){ const nx = new Set(reach); for(const r of reach) nx.add(r+u); reach = nx; } }
  return [...reach].sort((a,b) => a-b);
}
function plateCalc(target, mode){
  const sides = mode==='db2' ? 4 : 2, bar = mode==='curl' ? S.cfg.curlBar : S.bar, per = (target - bar)/2;
  if(per < 0) return 'Das ist weniger als die leere Stange ('+fmtN(bar)+' kg).';
  const sol = plateSolve(per, sides);
  if(sol) return sol.length ? 'Pro Seite: '+sol.map(([w,n]) => n+' × '+fmtN(w)+' kg').join(' + ')+(mode==='db2' ? ' (an beiden Kurzhanteln gleich)' : '') : 'Nur die Stange.';
  const r = plateReach(sides), u = Math.round(per*4); let lo = null, hi = null;
  for(const x of r){ if(x<=u) lo = x; if(x>u && hi===null) hi = x; }
  const wt = x => fmtN(bar + 2*x/4)+' kg';
  return hi===null ? 'Mehr als dein Vorrat hergibt. Maximal möglich: '+wt(lo)+'.' : 'Genau nicht möglich. Am nächsten: '+(lo!==null ? wt(lo)+' und ' : '')+wt(hi)+'.';
}
function platesCard(){

  const dbMax = S.bar + 2*plateCap(2), curlMax = S.cfg.curlBar + 2*plateCap(2);
  let h = `<div class="card"><h3>Gewichtsscheiben (Gusseisen)</h3><p class="small muted">Dein Vorrat gilt für Kurzhanteln und Curlstange. Kaufst du neue Scheiben, tippe unten auf das Gewicht.</p>`;
  h += ent.length ? `<table class="t"><tr><th>Scheibe</th><th>Anzahl</th><th>Summe</th><th></th></tr>${ent.map(([w,c]) => `<tr><td><b>${fmtN(w)} kg</b></td><td>${c} Stück</td><td>${fmtN(w*c)} kg</td><td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-a="pl-" data-w="${w}" aria-label="Eine ${fmtN(w)}-kg-Scheibe weniger">−</button> <button class="btn sm" data-a="pl+" data-w="${w}" aria-label="Eine ${fmtN(w)}-kg-Scheibe mehr">+</button></td></tr>`).join('')}</table>` : `<p class="muted small">Noch keine Scheiben eingetragen.</p>`;
  h += `<p style="margin:8px 0 2px"><b>Gesamt ${fmtN(plateTotal())} kg</b></p>
    <p class="small muted" style="margin:0">Zwei Kurzhanteln gleichzeitig: bis ${fmtN(maxDb())} kg pro Hantel. Eine Kurzhantel: bis ${fmtN(dbMax)} kg. Curlstange: bis ${fmtN(curlMax)} kg inklusive Stange. Kleinster Steigerungsschritt: ${fmtN(minStep())} kg.</p>
    <div class="tg">Schnell ergänzen (eine Scheibe pro Tipp)</div><div class="chiprow">${PLATE_W.map(w => `<button class="tchip" data-a="pl+" data-w="${w}">+ ${fmtN(w)} kg</button>`).join('')}</div>
    <div class="row" style="align-items:flex-end"><div class="field" style="margin:0"><label for="plw">Andere Scheibe (kg)</label><input id="plw" inputmode="decimal" placeholder="z. B. 7,5"></div><div class="field" style="margin:0;max-width:90px"><label for="plc">Stück</label><input id="plc" inputmode="numeric" value="1"></div><button class="btn" data-a="pladd">Hinzufügen</button></div>
    <h4 style="font-family:var(--head);font-size:1.1rem;margin:16px 0 4px">Scheibenrechner</h4>

    <div class="field"><label for="pc">Ziel (kg, ${UI.pm==='db2'?'pro Hantel':'gesamt'})</label><input id="pc" inputmode="decimal" placeholder="z. B. 22,5" value="${esc(UI.pc)}"></div></div>
    <p id="pcr" class="small" style="margin:0">${calcRes}</p></div>`;
  return h;

  else if(a==='leave'){ stopRest(); setView('today'); }
  else if(a==='tick'){
    const row = b.closest('.set'), ex = row.dataset.ex, i = +row.dataset.i, s = S.draft.sets[ex][i];
    s.d = !s.d; row.classList.toggle('done', s.d);
    let fbEl = row.nextElementSibling; if(fbEl && fbEl.classList.contains('fb')) fbEl.remove();
    if(s.d){
      let nx = row.nextElementSibling; const more = nx && nx.classList.contains('set');
      startRest(more ? exOf(ex).rest : Math.min(exOf(ex).rest,90));
      const fb = feedback(ex, i, s, !!more); if(fb) row.insertAdjacentHTML('afterend', fb);
    }
    updateWorkoutProgress(); save();
  }
  else if(a==='addset'){
    const ex = b.dataset.ex, arr = S.draft.sets[ex], last = arr[arr.length-1]; arr.push({w:last?last.w:'', r:'', d:false});
    const row = document.createElement('div'); row.innerHTML = setRow(ex, arr.length-1, arr[arr.length-1], exOf(ex).unit==='s');
    b.closest('section').insertBefore(row.firstElementChild, b); updateWorkoutProgress(); save();
  }
  else if(a==='finish') finishWorkout();
  else if(a==='sumdone'){ S.summary = null; flush(); setView('today'); }
  else if(a==='rest+'){ restEnd += 15000; restTick(); }
  else if(a==='rest-'){ restEnd -= 15000; restTick(); }
  else if(a==='restx') stopRest();
  else if(a==='play') startPlayer(b.dataset.m);
  else if(a==='pgo') playerGo();
  else if(a==='pnext') playerNext(false);
  else if(a==='pprev') playerPrev();
  else if(a==='pquit') playerQuit();
  else if(a==='wp'){ const d = ymd(new Date()), n = +b.dataset.n; S.wp[d] = (S.wp[d]||0) >= n ? n-1 : n; save(); render(); }
  else if(a==='savebody'){
    const kg = num($('#bw').value), st = num($('#bs').value);
    if(kg===null && st===null){ alert('Bitte Gewicht oder Schritte eintragen.'); return; }
    upsertBody(ymd(new Date()), {kg, steps:st}); render();
  }
  else if(a==='addbody'){
    const d = $('#md').value || ymd(new Date()), kg = num($('#mk').value), w = num($('#mw').value);
    if(kg===null && w===null){ alert('Bitte Gewicht oder Taille eintragen.'); return; }
    upsertBody(d, {kg, waist:w}); render();
  }
  else if(a==='delbody'){ if(confirm('Eintrag löschen?')){ S.body = S.body.filter(x => x.date!==b.dataset.d); save(); render(); } }
  else if(a==='install'){ if(installEvt){ installEvt.prompt(); installEvt = null; render(); } }
  else if(a==='export'){
    const blob = new Blob([JSON.stringify(S,null,1)],{type:'application/json'}), url = URL.createObjectURL(blob);
    const l = document.createElement('a'); l.href = url; l.download = 'trainingsbuch-sicherung-'+ymd(new Date())+'.json'; document.body.appendChild(l); l.click(); l.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); S.lastBackup = ymd(new Date()); save(); render();
  }
  else if(a==='import') $('#imp').click();
  else if(a==='reset'){ if(confirm('Wirklich ALLE Einträge löschen?') && confirm('Das kann nicht rückgängig gemacht werden. Sicher?')){ S = DEF(); flush(); stopRest(); setView('today'); } }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id==='q'){ UI.q = t.value; $('#exres').innerHTML = listHtml(); return; }
  if(t.id==='pq'){ UI.pq = t.value; $('#pres').innerHTML = pickList(); return; }
  if(t.dataset.fm && t.type!=='checkbox' && t.tagName!=='SELECT'){ UI.form[t.dataset.fm] = t.value; return; }
  if(t.matches('.set input')){ const row = t.closest('.set'); S.draft.sets[row.dataset.ex][+row.dataset.i][t.dataset.f] = t.value; save(); }
  else if(t.id==='note' && S.draft){ S.draft.note = t.value; save(); }
  else if(t.id==='pc'){ UI.pc = t.value; const v = num(t.value); $('#pcr').textContent = v===null ? 'Gib ein Zielgewicht ein.' : plateCalc(v, UI.pm); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='pm'){ UI.pm = t.value; const v = num(UI.pc); $('#pcr').textContent = v===null ? 'Gib ein Zielgewicht ein.' : plateCalc(v, UI.pm); render(); return; }
  if(t.dataset.fm){ UI.form[t.dataset.fm] = t.type==='checkbox' ? t.checked : t.value; return; }
  if(t.dataset.fma){ const arr = UI.form[t.dataset.fma], i = arr.indexOf(t.value); if(t.checked && i<0) arr.push(t.value); if(!t.checked && i>=0) arr.splice(i,1); return; }
  if(t.dataset.eq){
    const before = chosenIds(), avB = new Set(allIds().filter(exAvail)); S.eq[t.dataset.eq] = t.checked; const after = chosenIds(), avA = allIds().filter(exAvail);
    const add = [...after].filter(x => !before.has(x)), rem = [...before].filter(x => !after.has(x));
    const nm = x => x.startsWith('m:') ? x.slice(2)+' (Mobility)' : exOf(x).n;
    UI.toast = (add.length ? '<b>Neu im Plan:</b> '+add.map(nm).map(esc).join(', ')+'.' : '') + (add.length&&rem.length?'<br>':'') + (rem.length ? '<b>Ersetzt oder entfernt:</b> '+rem.map(nm).map(esc).join(', ')+'.' : '');
    const newAv = avA.filter(x => !avB.has(x) && !add.includes(x));
    if(newAv.length) UI.toast += (UI.toast?'<br>':'')+'<b>Neu verfügbar ('+newAv.length+'):</b> '+newAv.slice(0,5).map(x => esc(exOf(x).n)).join(', ')+(newAv.length>5?' und weitere':'')+'. Du findest sie im Tab Übungen, beim Tauschen und im Abwechslung-Modus.';
    if(S.draft){ UI.toast += (UI.toast?'<br>':'')+'Das laufende Training behält seine Übungen. Änderungen gelten ab dem nächsten Training.'; }
    save(); render(); return;
  }
  if(t.dataset.cfg){
    const k = t.dataset.cfg; if(k==='sex'||k==='variety') S.cfg[k] = t.value; else { const v = num(t.value); if(v!==null && v>0) S.cfg[k] = v; }
    save(); render(); return;
  }
  if(t.id==='sd' && t.value){ S.start = t.value; save(); }
  else if(t.id==='sb'){ const v = num(t.value); if(v!==null && v>=0){ S.bar = v; save(); } }
  else if(t.id==='exsel'){ UI.exSel = t.value; render(); }
  else if(t.id==='imp' && t.files[0]){
    const rd = new FileReader();
    rd.onload = () => { try{ const o = JSON.parse(rd.result); if(!o || !Array.isArray(o.sessions)) throw 0; if(confirm('Aktuelle Daten durch die Sicherung ersetzen?')){ adopt(o); flush(); setView('today'); } }catch(err){ alert('Diese Datei ist keine gültige Sicherung.'); } };
    rd.readAsText(t.files[0]);
  }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if(UI.view==='more') render(); });

/* ============ Start ============ */
(async function init(){
  const saved = await Store.load();
  if(saved && typeof saved==='object') adopt(saved);
  render();
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
